name: Recover v0.1.0 signed assets

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: unhook-bof-v0.1.0-signature-recovery
  cancel-in-progress: false

jobs:
  sign:
    name: Sign the original validated archive
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the original signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.1.0
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and source runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected=8d50ca6b53ea7b70139c8ad3101478d6ba0d4633
          [[ "$(git rev-parse HEAD)" == "$expected" ]]
          [[ "$(git rev-parse 'v0.1.0^{}')" == "$expected" ]]
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" --jq '.object.sha')
          [[ "$tag_object" == a5ebe57a179438eecdeada9282df9672752c6c6e ]]
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")
          jq -e --arg sha "$expected" \
            '.tag == "v0.1.0" and .object.sha == $sha and .verification.verified == true' \
            <<< "$tag" >/dev/null
          unsigned_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37177357560")
          jq -e --arg sha "$expected" \
            '.head_sha == $sha and .event == "push" and .status == "completed"' \
            <<< "$unsigned_run" >/dev/null
          e2e_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37176744422")
          jq -e --arg sha "$expected" \
            '.head_sha == $sha and .head_branch == "master" and .event == "push" and .conclusion == "success"' \
            <<< "$e2e_run" >/dev/null

      - name: Restore and validate exact unsigned tag archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 37177357560 --repo "$GITHUB_REPOSITORY" \
            --name unhook-bof-unsigned --dir dist
          echo '817900d6b0c8582dfb5ee537b5ca855e93febd5330c4fda209c18e4fa16b4526  dist/unhook-bof.tar.gz' \
            | sha256sum --check --status
          python3 scripts/validate_archive.py --archive dist/unhook-bof.tar.gz \
            --version v0.1.0
          gh run download 37176744422 --repo "$GITHUB_REPOSITORY" \
            --name sliver-bof-e2e-objects --dir "$RUNNER_TEMP/tested-objects"
          python3 scripts/compare_tested_objects.py \
            --archive dist/unhook-bof.tar.gz --tested-dir "$RUNNER_TEMP/tested-objects"

      - name: Install distribution-verified Minisign
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign

      - name: Install checksum-pinned original signer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legacy-minisign"
          curl -q --fail --location --retry 3 --retry-delay 2 \
            --output "$RUNNER_TEMP/minisign-linux-amd64.tar.gz" \
            'https://github.com/aead/minisign/releases/download/v0.2.0/minisign-linux-amd64.tar.gz'
          echo "c21b083e5a0b340a3580179abecdf7bd3359607ced37552aa6c1f41ed74f516d  $RUNNER_TEMP/minisign-linux-amd64.tar.gz" \
            | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/minisign-linux-amd64.tar.gz" \
            -C "$RUNNER_TEMP/legacy-minisign" minisign
          chmod 0755 "$RUNNER_TEMP/legacy-minisign/minisign"
          "$RUNNER_TEMP/legacy-minisign/minisign" -v

      - name: Sign with the existing repository key format
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${MINISIGN_PRIVATE_KEY:?MINISIGN_PRIVATE_KEY is unavailable}"
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          # The 2022 release workflow rendered this unchanged secret with echo -e.
          printf '%b\n' "$MINISIGN_PRIVATE_KEY" > "$key_file"
          manifest=$(tar -xOzf dist/unhook-bof.tar.gz ./extension.json | base64 -w 0)
          printf '\n' | "$RUNNER_TEMP/legacy-minisign/minisign" -S -s "$key_file" \
            -m dist/unhook-bof.tar.gz \
            -x dist/unhook-bof.minisig -t "$manifest"

      - name: Verify signature against the indexed key and archived manifest
        run: |
          set -euo pipefail
          python3 scripts/validate_signature.py --archive dist/unhook-bof.tar.gz \
            --signature dist/unhook-bof.minisig \
            --public-key 'RWTfJUbkhmANsG740AhAuvsBY1hGaiMQYPq3DxZcT2zYQZ1sMbRnDsP+'
          sha256sum dist/unhook-bof.tar.gz dist/unhook-bof.minisig

      - name: Upload verified assets for release publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unhook-bof-v0.1.0-signed
          path: |
            dist/unhook-bof.tar.gz
            dist/unhook-bof.minisig
          if-no-files-found: error
          retention-days: 30
